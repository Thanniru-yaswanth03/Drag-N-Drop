services:
  - type: web
    name: drag-n-drop-backend
    env: python
    buildCommand: pip install -r pm/backend/requirements.txt
    startCommand: cd pm/backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "*"

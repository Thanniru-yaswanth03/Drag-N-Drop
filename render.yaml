services:
  - type: web
    name: drag-n-drop-backend
    env: docker
    plan: starter
    dockerfilePath: Dockerfile
    disk:
      name: pm-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /data/pm.db
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true




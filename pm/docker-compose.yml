version: "3.8"

services:
  kanban-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban_studio_app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=drag_n_drop_prod_secret_key_2026
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - RATE_LIMIT_LOGIN_MAX=15
      - RATE_LIMIT_LOGIN_WINDOW_SECONDS=60
      - DATABASE_PATH=/app/backend/data/pm.db
    volumes:
      - kanban_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kanban_data:
